<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" width="1100" height="390">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#0c1017"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.2"/>
    </pattern>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Geist Mono', ui-monospace, Menlo, monospace; }
    
    @keyframes pulseBeam {
      0% { stroke-dashoffset: 160; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes blinkLed {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .pulse-beam { stroke-dasharray: 20 60; animation: pulseBeam 2.5s linear infinite; }
    .blink-led { animation: blinkLed 1.8s ease-in-out infinite; }
  </style>

  <rect width="1100" height="390" rx="12" fill="url(#bg)"/>
  <rect width="1100" height="390" rx="12" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1099" height="389" rx="11.5" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(40, 36)">
    <text x="0" y="0" fill="#f1f5f9" class="font-mono" font-size="14" font-weight="700" letter-spacing="1">PARADIGM COMPARISON: LATENCY &amp; IDLE TIME REDUCTION</text>
    <text x="0" y="20" fill="#64748b" class="font-sans" font-size="12">How Speculative Skeleton Pipelining eliminates blocked agent idle states</text>
  </g>

  <!-- ================= SECTION 1: TRADITIONAL SEQUENTIAL ================= -->
  <g transform="translate(40, 84)">
    <rect x="0" y="0" width="1020" height="110" rx="8" fill="#0f172a" fill-opacity="0.6" stroke="rgba(239, 68, 68, 0.25)" stroke-width="1"/>
    
    <!-- Title -->
    <circle cx="20" cy="22" r="4" fill="#ef4444"/>
    <text x="32" y="26" fill="#f87171" class="font-mono" font-size="11" font-weight="700">TRADITIONAL MONOLITHIC FLOW (BLOCKED SEQUENTIAL)</text>
    <text x="830" y="26" fill="#ef4444" class="font-mono" font-size="11" font-weight="700">TOTAL: ~4.5x LATENCY</text>

    <!-- Steps -->
    <g transform="translate(20, 46)">
      <!-- Step 1 -->
      <rect x="0" y="0" width="180" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" fill="#94a3b8" class="font-mono" font-size="10">STEP 1: Planner</text>
      <text x="14" y="34" fill="#cbd5e1" class="font-mono" font-size="11" font-weight="600">Wait for spec...</text>
      <!-- Arrow -->
      <path d="M 185 21 L 205 21" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
      
      <!-- Step 2 -->
      <rect x="210" y="0" width="180" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" fill="#94a3b8" class="font-mono" font-size="10">STEP 2: Backend</text>
      <text x="14" y="34" fill="#cbd5e1" class="font-mono" font-size="11" font-weight="600">Blocked idle UI</text>
      <!-- Arrow -->
      <path d="M 395 21 L 415 21" stroke="#475569" stroke-width="2"/>

      <!-- Step 3 -->
      <rect x="420" y="0" width="180" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" fill="#94a3b8" class="font-mono" font-size="10">STEP 3: Frontend</text>
      <text x="14" y="34" fill="#cbd5e1" class="font-mono" font-size="11" font-weight="600">Blocked idle QA</text>
      <!-- Arrow -->
      <path d="M 605 21 L 625 21" stroke="#475569" stroke-width="2"/>

      <!-- Step 4 -->
      <rect x="630" y="0" width="180" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" fill="#94a3b8" class="font-mono" font-size="10">STEP 4: QA Tests</text>
      <text x="14" y="34" fill="#cbd5e1" class="font-mono" font-size="11" font-weight="600">Late regressions</text>
      <!-- Arrow -->
      <path d="M 815 21 L 835 21" stroke="#475569" stroke-width="2"/>

      <!-- Step 5 -->
      <rect x="840" y="0" width="130" height="42" rx="6" fill="#1e293b" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1"/>
      <text x="14" y="20" fill="#f87171" class="font-mono" font-size="10">STEP 5: Report</text>
      <text x="14" y="34" fill="#fca5a5" class="font-mono" font-size="11" font-weight="600">Deliverable</text>
    </g>
  </g>

  <!-- ================= SECTION 2: SPECULATIVE SKELETON ================= -->
  <g transform="translate(40, 218)">
    <rect x="0" y="0" width="1020" height="136" rx="8" fill="#0f172a" fill-opacity="0.75" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1"/>
    
    <!-- Title -->
    <circle cx="20" cy="22" r="4" fill="#10b981" class="blink-led"/>
    <text x="32" y="26" fill="#34d399" class="font-mono" font-size="11" font-weight="700">SPECULATIVE SKELETON PIPELINING (ANTIGRAVITY v3.0)</text>
    <text x="760" y="26" fill="#10b981" class="font-mono" font-size="11" font-weight="700">EFFICIENCY: ~1.0x (CONCURRENT FAN-OUT)</text>

    <!-- Fan-out Layout -->
    <g transform="translate(20, 46)">
      <!-- Data Contract Node -->
      <rect x="0" y="0" width="160" height="74" rx="6" fill="#0b1324" stroke="#06b6d4" stroke-width="1.2"/>
      <text x="14" y="22" fill="#38bdf8" class="font-mono" font-size="10" font-weight="700">DATA CONTRACT</text>
      <text x="14" y="40" fill="#f1f5f9" class="font-mono" font-size="11" font-weight="600">ui_data.json</text>
      <text x="14" y="58" fill="#94a3b8" class="font-mono" font-size="10">results.json schema</text>

      <!-- Connecting Bus Beams -->
      <path d="M 160 18 L 220 18" stroke="#06b6d4" stroke-width="2" class="pulse-beam"/>
      <path d="M 160 37 L 220 37" stroke="#6366f1" stroke-width="2" class="pulse-beam"/>
      <path d="M 160 56 L 220 56" stroke="#10b981" stroke-width="2" class="pulse-beam"/>

      <!-- Parallel Lanes -->
      <!-- Lane 1: DB + Backend -->
      <rect x="220" y="4" width="220" height="30" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1"/>
      <text x="12" y="20" fill="#93c5fd" class="font-mono" font-size="10" font-weight="600">Lane 1: senior-dev (APIs)</text>

      <!-- Lane 2: Frontend Craft UI -->
      <rect x="220" y="40" width="220" height="30" rx="4" fill="#1e293b" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1"/>
      <text x="12" y="20" fill="#d8b4fe" class="font-mono" font-size="10" font-weight="600">Lane 2: visual-designer (UI)</text>

      <!-- Lane 3: TDD Tests -->
      <rect x="455" y="4" width="210" height="30" rx="4" fill="#1e293b" stroke="#10b981" stroke-opacity="0.5" stroke-width="1"/>
      <text x="12" y="20" fill="#86efac" class="font-mono" font-size="10" font-weight="600">Lane 3: test-engineer (TDD)</text>

      <!-- Lane 4: Typst Report -->
      <rect x="455" y="40" width="210" height="30" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="1"/>
      <text x="12" y="20" fill="#fde68a" class="font-mono" font-size="10" font-weight="600">Lane 4: typst-reporter (PDF)</text>

      <!-- Convergence Bus -->
      <path d="M 670 19 L 720 37" stroke="#10b981" stroke-width="2"/>
      <path d="M 670 55 L 720 37" stroke="#10b981" stroke-width="2"/>

      <!-- Zero-Lag Join & Gate -->
      <rect x="720" y="10" width="250" height="56" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="738" cy="38" r="5" fill="#10b981" class="blink-led"/>
      <text x="752" y="32" fill="#a7f3d0" class="font-mono" font-size="11" font-weight="700">ZERO-LAG JOIN</text>
      <text x="752" y="50" fill="#6ee7b7" class="font-mono" font-size="10">Verified &amp; Green DoD Pass</text>
    </g>
  </g>
</svg>