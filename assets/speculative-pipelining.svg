<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="1100" height="400">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080d"/>
      <stop offset="50%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#0a0d17"/>
    </linearGradient>
    <linearGradient id="green-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="cyan-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="pink-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>

  <!-- Background -->
  <rect width="1100" height="400" rx="14" fill="url(#bg3)"/>
  <rect x="0.5" y="0.5" width="1099" height="399" rx="13.5" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 38)">
    <text x="0" y="0" fill="#f8fafc" class="font-sans" font-size="20" font-weight="700">SPECULATIVE SKELETON PIPELINING</text>
    <text x="0" y="22" fill="#94a3b8" class="font-sans" font-size="13">Zero-Lag Concurrent Fan-out vs Traditional Blocking Pipeline • 50% Latency Elimination</text>
  </g>

  <!-- Time Axis Marks -->
  <g transform="translate(240, 80)">
    <text x="0" y="0" fill="#64748b" class="font-mono" font-size="11">0.0s</text>
    <text x="180" y="0" fill="#64748b" class="font-mono" font-size="11">0.4s</text>
    <text x="360" y="0" fill="#64748b" class="font-mono" font-size="11">0.8s (Spec Join)</text>
    <text x="540" y="0" fill="#64748b" class="font-mono" font-size="11">1.2s</text>
    <text x="720" y="0" fill="#64748b" class="font-mono" font-size="11">1.6s</text>
    
    <!-- Vertical Grid Guidelines -->
    <line x1="0" y1="10" x2="0" y2="250" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 4"/>
    <line x1="180" y1="10" x2="180" y2="250" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 4"/>
    <line x1="360" y1="10" x2="360" y2="250" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="540" y1="10" x2="540" y2="250" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 4"/>
    <line x1="720" y1="10" x2="720" y2="250" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- SECTION 1: TRADITIONAL SEQUENTIAL EXECUTION -->
  <g transform="translate(48, 120)">
    <text x="0" y="22" fill="#94a3b8" class="font-sans" font-size="13" font-weight="600">Traditional</text>
    <text x="0" y="38" fill="#64748b" class="font-mono" font-size="11">Blocking Serial</text>

    <!-- Phase 1: Computation -->
    <rect x="192" y="6" width="360" height="34" rx="6" fill="#334155" stroke="#475569" stroke-width="1"/>
    <text x="210" y="28" fill="#e2e8f0" class="font-sans" font-size="12" font-weight="500">Lane 1: Compute / Dev (0.8s)</text>

    <!-- Phase 2: Reporter/UI Waiting (Idle gap) & Execution -->
    <rect x="552" y="6" width="360" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="570" y="28" fill="#94a3b8" class="font-sans" font-size="12">Lane 2: UI / Typst Report (0.8s)</text>

    <!-- Duration Pill -->
    <rect x="930" y="8" width="95" height="30" rx="6" fill="#450a0a" stroke="#7f1d1d" stroke-width="1"/>
    <text x="946" y="28" fill="#f87171" class="font-mono" font-size="12" font-weight="700">1.60s (Slow)</text>
  </g>

  <!-- SECTION 2: SPECULATIVE SKELETON PIPELINING -->
  <g transform="translate(48, 205)">
    <text x="0" y="22" fill="#10b981" class="font-sans" font-size="13" font-weight="700">Antigravity</text>
    <text x="0" y="38" fill="#34d399" class="font-mono" font-size="11">Spec Pipelining</text>

    <!-- Lane 1: Concurrent Data Producer -->
    <rect x="192" y="0" width="360" height="32" rx="6" fill="url(#cyan-bar)"/>
    <text x="210" y="21" fill="#ffffff" class="font-sans" font-size="12" font-weight="600">Lane 1: Computation writes calc_results.json</text>

    <!-- Lane 2: Concurrent Speculative Skeleton Construction -->
    <rect x="192" y="40" width="360" height="32" rx="6" fill="url(#pink-bar)"/>
    <text x="210" y="61" fill="#ffffff" class="font-sans" font-size="12" font-weight="600">Lane 2: Typst / UI builds Mock Skeleton &amp; Layout</text>

    <!-- Instant Zero-Lag Join Marker -->
    <g transform="translate(560, 16)">
      <circle cx="16" cy="18" r="16" fill="#10b981"/>
      <path d="M11 18 L15 22 L22 14" stroke="#ffffff" stroke-width="2.5" fill="none"/>
    </g>

    <!-- Duration Pill -->
    <rect x="930" y="20" width="95" height="30" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="946" y="40" fill="#34d399" class="font-mono" font-size="12" font-weight="700">0.80s (-50%)</text>
  </g>

  <!-- Bottom Summary Callout -->
  <g transform="translate(48, 330)">
    <rect width="1004" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="18" y="26" fill="#10b981" class="font-mono" font-size="11" font-weight="700">⚡ ZERO-LAG JOIN INVARIANT:</text>
    <text x="220" y="26" fill="#cbd5e1" class="font-sans" font-size="12">
      Downstream agents (Typst reporter, Visual designer) never wait for computation to complete. They build layout skeletons immediately and hydrate JSON in 0ms.
    </text>
  </g>
</svg>