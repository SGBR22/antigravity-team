<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 278 32" width="278" height="32">
  <defs>
    <linearGradient id="bg-badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Geist Mono', ui-monospace, Menlo, monospace; }
    @keyframes pulseLed {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 3px #06b6d4); }
      50% { opacity: 0.35; filter: none; }
    }
    .anim-pulse { animation: pulseLed 2s ease-in-out infinite; }
  </style>
  <rect width="278" height="32" rx="6" fill="url(#bg-badge)"/>
  <rect x="0.5" y="0.5" width="277" height="31" rx="5.5" fill="none" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1"/>
  
  <!-- LED Dot -->
  <circle cx="14" cy="16" r="4" fill="#06b6d4" class="anim-pulse"/>

  <!-- Title Left -->
  <text x="26" y="20" fill="#94a3b8" class="font-mono" font-size="11" font-weight="600">CLUSTER</text>
  
  <!-- Divider -->
  <line x1="86.5" y1="8" x2="86.5" y2="24" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Label Right -->
  <text x="96.5" y="20" fill="#06b6d4" class="font-mono" font-size="11" font-weight="700">DETERMINISTIC (T=0.0)</text>
</svg>