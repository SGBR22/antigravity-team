<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080d"/>
      <stop offset="50%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#090d17"/>
    </linearGradient>
    <linearGradient id="linux-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="win-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>

  <!-- Background -->
  <rect width="1100" height="360" rx="14" fill="url(#bg6)"/>
  <rect x="0.5" y="0.5" width="1099" height="359" rx="13.5" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 38)">
    <text x="0" y="0" fill="#f8fafc" class="font-sans" font-size="20" font-weight="700">CROSS-PLATFORM RUNTIME PARITY MATRIX</text>
    <text x="0" y="22" fill="#94a3b8" class="font-sans" font-size="13">Native Shell Commands • Path Separator Normalization • Dual OS Support</text>
  </g>

  <!-- Column 1: Linux Terminal -->
  <g transform="translate(48, 85)">
    <rect width="485" height="235" rx="10" fill="url(#linux-grad)" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="0" y="0" width="485" height="3" fill="#0284c7"/>

    <!-- Title & OS Badge -->
    <text x="20" y="30" fill="#38bdf8" class="font-mono" font-size="12" font-weight="700">🐧 LINUX TERMINAL / POSIX CLI</text>
    <text x="20" y="52" fill="#f8fafc" class="font-sans" font-size="16" font-weight="700">Ubuntu, Debian, Fedora, Arch, Docker, SSH</text>

    <!-- Checklist -->
    <g transform="translate(20, 75)">
      <text x="0" y="15" fill="#10b981" class="font-mono" font-size="13">✔</text>
      <text x="24" y="15" fill="#e2e8f0" class="font-sans" font-size="13">100% Core Multi-Agent Orchestration &amp; Subagents</text>

      <text x="0" y="42" fill="#10b981" class="font-mono" font-size="13">✔</text>
      <text x="24" y="42" fill="#e2e8f0" class="font-sans" font-size="13">Native Headless TDD (pytest -q, bash, curl, jq)</text>

      <text x="0" y="69" fill="#10b981" class="font-mono" font-size="13">✔</text>
      <text x="24" y="69" fill="#e2e8f0" class="font-sans" font-size="13">Typst 0.13+ Compiler &amp; GOST 7.32 PDF Engine</text>

      <text x="0" y="96" fill="#10b981" class="font-mono" font-size="13">✔</text>
      <text x="24" y="96" fill="#e2e8f0" class="font-sans" font-size="13">Blender 4.x Headless bpy 3D Geometry Generation</text>

      <text x="0" y="123" fill="#10b981" class="font-mono" font-size="13">✔</text>
      <text x="24" y="123" fill="#e2e8f0" class="font-sans" font-size="13">COMSOL MPh Server &amp; PyFEMM Linux Workflows</text>
    </g>
  </g>

  <!-- Column 2: Windows PowerShell -->
  <g transform="translate(567, 85)">
    <rect width="485" height="235" rx="10" fill="url(#win-grad)" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="0" y="0" width="485" height="3" fill="#6366f1"/>

    <!-- Title & OS Badge -->
    <text x="20" y="30" fill="#a5b4fc" class="font-mono" font-size="12" font-weight="700">🪟 WINDOWS POWERSHELL / COMMAND LINE</text>
    <text x="20" y="52" fill="#f8fafc" class="font-sans" font-size="16" font-weight="700">PowerShell 7 / 5.1, cmd.exe, Native Windows</text>

    <!-- Checklist -->
    <g transform="translate(20, 75)">
      <text x="0" y="15" fill="#10b981" class="font-mono" font-size="13">✔</text>
      <text x="24" y="15" fill="#e2e8f0" class="font-sans" font-size="13">KOMPAS-3D v21-v23 pywin32 COM Automation</text>

      <text x="0" y="42" fill="#10b981" class="font-mono" font-size="13">✔</text>
      <text x="24" y="42" fill="#e2e8f0" class="font-sans" font-size="13">Direct Stamp Population according to GOST 2.104</text>

      <text x="0" y="69" fill="#10b981" class="font-mono" font-size="13">✔</text>
      <text x="24" y="69" fill="#e2e8f0" class="font-sans" font-size="13">Automatic Win32 Path Normalization (forward/back slash)</text>

      <text x="0" y="96" fill="#10b981" class="font-mono" font-size="13">✔</text>
      <text x="24" y="96" fill="#e2e8f0" class="font-sans" font-size="13">Batch STEP / PDF CAD Export Pipeline</text>

      <text x="0" y="123" fill="#10b981" class="font-mono" font-size="13">✔</text>
      <text x="24" y="123" fill="#e2e8f0" class="font-sans" font-size="13">Full Typst + FEMM + Blender + Dev Agent Parity</text>
    </g>
  </g>
</svg>